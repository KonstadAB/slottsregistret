# Letar VR Medias 360-bilder runt slotten och golfklubbarna (se tools/vr-media-skanna.mjs). Bara på claude/-grenar.
name: Leta VR Medias bilder
on:
  push:
    branches: ['claude/**']
    paths: ['data/source/vr-media-platser.json', 'tools/vr-media-skanna.mjs']
permissions:
  contents: write
jobs:
  skanna:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/vr-media-skanna.mjs
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
      - name: Spara svaret på grenen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/vr-media-skanning.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Svar: VR Medias bilder"
          git push
