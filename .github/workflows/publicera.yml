# Bygger och publicerar sajten till Cloudflare (Workern slottsregistret) vid varje push till main.
# Kräver hemligheten CLOUDFLARE_API_TOKEN (behörighet att redigera Workers).
name: Publicera
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicera
  cancel-in-progress: false
jobs:
  publicera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - name: Publicera till Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 36f39bea33a1d0e03815a8b01039efea
        run: npx -y wrangler@4 deploy --message "$(git log -1 --format=%s | head -c 100)"
