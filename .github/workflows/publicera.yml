# Bygger och publicerar sajten till Cloudflare (Workern slottsregistret) vid varje push till main.
# Kräver hemligheten CLOUDFLARE_API_TOKEN (behörighet att redigera Workers).
name: Publicera
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      token:
        description: 'API-nyckel (bara tills hemligheten CLOUDFLARE_API_TOKEN finns)'
        default: ''
permissions:
  contents: read
concurrency:
  group: publicera
  cancel-in-progress: false
jobs:
  publicera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - name: Publicera till Cloudflare
        env:
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 36f39bea33a1d0e03815a8b01039efea
        run: |
          T=$(jq -r '.inputs.token // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; export CLOUDFLARE_API_TOKEN="$T"; else export CLOUDFLARE_API_TOKEN="$SECRET_TOKEN"; fi
          set -o pipefail
          npx -y wrangler@4 deploy --message "$(git log -1 --format=%s | head -c 100)" 2>&1 | tee publicera-logg.txt
