# Bygger och publicerar sajten till Cloudflare (Workern slottsregistret) vid varje push till main och varje natt
# (då kommer slottens godkända ändringar från kontona med, se worker/konto.js).
# Kräver hemligheten CLOUDFLARE_API_TOKEN (behörighet att redigera Workers).
name: Publicera
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # varje natt, så att slottens godkända ändringar kommer ut på sajten
  workflow_dispatch:
    inputs:
      token:
        description: 'API-nyckel (bara tills hemligheten CLOUDFLARE_API_TOKEN finns)'
        default: ''
permissions:
  contents: read
concurrency:
  group: publicera
  cancel-in-progress: false
jobs:
  publicera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hämta slottens godkända uppgifter
        id: profiler
        run: |
          if curl -fsS --retry 3 --max-time 30 https://slottsregistret.se/api/profiler.json -o p.json && jq -e 'type == "object"' p.json >/dev/null; then
            mv p.json data/slottsprofiler.json; echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo '{}' > data/slottsprofiler.json; echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kunde inte hämta slottens uppgifter."
          fi
          echo "Slott med egna uppgifter: $(jq 'length' data/slottsprofiler.json)"
      # På natten publiceras bara när slottens uppgifter gick att hämta (annars skulle de försvinna från sajten till nästa gång).
      - run: node build.js
        if: steps.profiler.outputs.ok == 'true' || github.event_name != 'schedule'
      - name: Publicera till Cloudflare
        if: steps.profiler.outputs.ok == 'true' || github.event_name != 'schedule'
        env:
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 36f39bea33a1d0e03815a8b01039efea
        run: |
          T=$(jq -r '.inputs.token // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; export CLOUDFLARE_API_TOKEN="$T"; else export CLOUDFLARE_API_TOKEN="$SECRET_TOKEN"; fi
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::Ingen Cloudflare-nyckel ännu – hoppar över publiceringen."; exit 0; fi
          npx -y wrangler@4 deploy --message "$(git log -1 --format=%s | head -c 100)" 2>&1 | tee publicera-logg.txt
