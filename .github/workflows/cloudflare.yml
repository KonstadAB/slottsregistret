# Ändrar och visar Cloudflare-kontot för slottsregistret.se via tools/cloudflare.mjs (arbetsmiljön når inte Cloudflare).
# Kommandot läses från data/source/cloudflare-kommando.txt (eller indata "cmd"), och utskriften sparas i
# data/source/cloudflare-logg.txt på samma gren, så att den går att läsa utan Actions-loggen.
# Nyckeln tas från hemligheten CLOUDFLARE_API_TOKEN.
name: Cloudflare
on:
  push:
    branches: ['claude/**']
    paths: ['data/source/cloudflare-kommando.txt']
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Kommando till tools/cloudflare.mjs'
        default: ''
      token:
        description: 'API-nyckel (bara tills hemligheten CLOUDFLARE_API_TOKEN finns)'
        default: ''
permissions:
  contents: write
concurrency:
  group: cloudflare-${{ github.ref }}
jobs:
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kör kommandot
        env:
          SECRET_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          T=$(jq -r '.inputs.token // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$T" ]; then echo "::add-mask::$T"; export CLOUDFLARE_API_TOKEN="$T"; else export CLOUDFLARE_API_TOKEN="$SECRET_TOKEN"; fi
          CMD=$(jq -r '.inputs.cmd // ""' "$GITHUB_EVENT_PATH")
          [ -z "$CMD" ] && CMD=$(cat data/source/cloudflare-kommando.txt 2>/dev/null || echo status)
          { echo "# $(date -u +%FT%TZ) $CMD"; node tools/cloudflare.mjs "$CMD" 2>&1; } | tee data/source/cloudflare-logg.txt
      - name: Spara utskriften på grenen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/cloudflare-logg.txt
          git diff --cached --quiet || git commit -m "Cloudflare-logg"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
